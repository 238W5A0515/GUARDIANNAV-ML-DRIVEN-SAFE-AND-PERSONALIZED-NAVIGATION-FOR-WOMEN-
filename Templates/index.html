<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Route Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Safe Route Recommendation</h1>
        <form id="routeForm" method="POST">
            <div class="mb-3">
                <label for="startAddress" class="form-label">Start Address:</label>
                <input type="text" id="startAddress" class="form-control" placeholder="Enter starting location" required>
                <input type="hidden" name="start_lat" id="start_lat">
                <input type="hidden" name="start_lon" id="start_lon">
            </div>
            <div class="mb-3">
                <label for="endAddress" class="form-label">End Address:</label>
                <input type="text" id="endAddress" class="form-control" placeholder="Enter destination location" required>
                <input type="hidden" name="end_lat" id="end_lat">
                <input type="hidden" name="end_lon" id="end_lon">
            </div>
            <button type="submit" class="btn btn-primary w-100">Generate Safe Route</button>
        </form>
        <div class="mt-4">
            {{ map_html|safe }}
        </div>
    </div>
    <script src="static/script.js"></script>
</body>
</html>
